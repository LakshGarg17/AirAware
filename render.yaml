services:
  - type: web
    name: airaware-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["*"]' # In production, restrict to your specific Vercel frontend URL
      - key: AI_ENABLED
        value: "true"
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: GEMINI_API_KEY
        sync: false # Set via Render Dashboard - Secret Environment Variables
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: AI_TIMEOUT_SECONDS
        value: "20"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "2048"
      - key: CHAT_MAX_MESSAGE_CHARS
        value: "500"
      - key: CHAT_MAX_HISTORY_TURNS
        value: "8"
